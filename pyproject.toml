[project]
name = "only-stock"
version = "0.1.0"
description = "面向小型公司/组织的仓库与库存管理系统（FastAPI + SQLite + Jinja2/HTMX + MCP）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "jinja2>=3.1.4",
    "argon2-cffi>=23.1.0",
    "apscheduler>=3.10.4,<4",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.17",
    "mcp>=1.9.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.2",
    "pip-audit>=2.10.1",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.8.4",
]

# 应用不是可安装的分发包；uv sync 只安装依赖，不构建项目自身。
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

# src 声明源码目录；显式声明第一方包，避免 isort 把 app 误判为第三方。
[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
